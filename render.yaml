services:
  - type: web
    name: study-guide-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-eng && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: RELOAD
        value: false
      - key: DB_PATH
        value: /tmp/study-guide/database.db
      - key: DATASETS_DIR
        value: /tmp/study-guide/datasets
      - key: OCR_DPI
        value: 300
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: meta-llama/llama-4-scout-17b-16e-instruct
